---
- name: Configure VPS Ubuntu
  hosts: vps
  become: true

  roles:
    - role: setup
      tags: [setup]

    # Garde-fous hôte déployables sans rejouer `setup` (qui ferait un dist-upgrade).
    - role: host_guardrails
      tags: [host_guardrails]

    - role: traefik
      tags: [traefik]

    # Retiré du VPS le 13/09/2026 : non utilisé (accès par tunnel SSH seul
    # depuis le 13/08/2026, jamais ouvert), pour 27 Mo de RAM sur un VPS qui
    # tourne à 79 Mo de libre, et surtout il monte /var/run/docker.sock —
    # l'atteindre équivaut à être root sur l'hôte entier. Un service de moins
    # avec cet accès. Réactiver la ligne ci-dessous le réinstallerait.
    # - role: portainer
    #   tags: [portainer]

    - role: postgres
      tags: [postgres]

    # Retiré du VPS le 24/08/2026 : Adminer exposait un accès web à la base de
    # production sur db.mibeko.fr, pour un service qu'un tunnel SSH rend déjà.
    # Réactiver la ligne ci-dessous le réinstallerait.
    # - role: adminer
    #   tags: [adminer]

    # - role: cloudbeaver
    #   tags: [cloudbeaver]

    - role: minio
      tags: [minio]

    # Sauvegarde objet par objet du corpus vers un stockage hors VPS.
    # Le rôle est inerte tant que corpus_backup_enabled=false et n'exécute
    # jamais le miroir au déploiement : le premier transfert reste une
    # opération humaine contrôlée.
    - role: corpus_backup
      tags: [corpus_backup]

    # Désactivé le 10/08/2026 : MINERU_BACKEND=cloud en production (mibeko-python
    # appelle l'API SaaS mineru.net, pas ce conteneur) et le VPS n'a que 1,9 Go de
    # RAM — MinerU en réclame ≥ 6 Go, il ne pourrait de toute façon jamais parser
    # un document ici sans être tué par l'OOM killer. Image + volume de modèles
    # supprimés (2,85 Go). Ne pas réactiver sans un VPS dimensionné pour, et sans
    # revérifier MINERU_BACKEND.
    # - role: mineru
    #   tags: [mineru]

    - role: dozzle
      tags: [dozzle]

    - role: umami
      tags: [umami]
