---
# Variables globales du VPS
# Remplacez ces valeurs avant de lancer le playbook

# ─── Domaine principal ───────────────────────────────────────────────────────
domain: "your-domain.com"

# ─── Traefik ─────────────────────────────────────────────────────────────────
# Email pour les certificats Let's Encrypt
traefik_acme_email: "admin@your-domain.com"
# Identifiants du dashboard Traefik (générer avec: htpasswd -nb user password)
# ⚠️ Ne jamais écrire le mot de passe en clair ici : seul le hash est attendu,
#    et uniquement dans group_vars/vps.yml (gitignoré).
traefik_dashboard_users: "admin:$$apr1$$REMPLACER_PAR_LE_HASH_HTPASSWD"

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
postgres_user: "pguser"
postgres_password: "changeme"
postgres_db: "appdb"

# ─── MinIO ────────────────────────────────────────────────────────────────────
minio_root_user: "minioadmin"
minio_root_password: "changeme"

# ─── Sauvegarde hors site du corpus MinIO ───────────────────────────────────
# Le rôle reste inerte par défaut. L'activer seulement après avoir créé :
#   1. un utilisateur MinIO dédié, limité à ListBucket/GetObject ;
#   2. un conteneur Infomaniak distinct avec versionnage Swift activé ;
#   3. des identifiants S3 dédiés au conteneur distant.
corpus_backup_enabled: false
corpus_backup_timer_enabled: false
# Mettre temporairement à true pour retirer la commande, la configuration et
# les unités systemd déployées, sans toucher aux stockages ni aux identités.
corpus_backup_remove: false
# corpus_backup_source_access_key: "mibeko-backup-ro"
# corpus_backup_source_secret_key: "REMPLACER"
# corpus_backup_offsite_endpoint: "https://s3.pub1.infomaniak.cloud"
# corpus_backup_offsite_access_key: "REMPLACER"
# corpus_backup_offsite_secret_key: "REMPLACER"
# Objet PDF immuable utilisé comme sonde SHA-256 après chaque miroir.
# corpus_backup_probe_object: "sources/<uuid>/<fichier>.pdf"
# URL ping optionnelle (par exemple Healthchecks.io), sans slash final.
# corpus_backup_healthcheck_url: "https://hc-ping.com/<uuid>"

# ─── Umami (analytics self-hosted, stats.<domain>) ───────────────────────────
# Base + utilisateur PostgreSQL dédiés, créés automatiquement par le rôle.
# ⚠️ Utiliser des valeurs sans caractères spéciaux d'URL (le mot de passe est
# injecté dans DATABASE_URL) — ex: openssl rand -hex 16
umami_db_password: "changeme"
# Secret applicatif Umami (signature des sessions) — ex: openssl rand -hex 32
umami_app_secret: "changeme"
# Optionnel : surcharger les défauts du rôle (roles/umami/defaults/main.yml)
# umami_db_name: "umami"
# umami_db_user: "umami"
# umami_image: "ghcr.io/umami-software/umami:postgresql-latest"

# ─── MinerU (extraction PDF → MD/JSON) ────────────────────────────────────────
# Optionnel : le rôle a déjà des valeurs par défaut (roles/mineru/defaults/main.yml).
# Décommenter pour surcharger.
# mineru_version: "3.4.0"          # doit matcher une version publiée sur PyPI
# mineru_port: 8004               # bind 127.0.0.1 uniquement (debug / tunnel SSH)
# mineru_model_source: "huggingface"  # ou "modelscope" si HF lent/bloqué
# mineru_mem_limit: ""            # ex: "8g" ; vide = pas de limite
